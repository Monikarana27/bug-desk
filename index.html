<style>
  :root{
    --bg: #0B0E14;
    --surface: #131722;
    --surface-2: #1B2030;
    --surface-3: #202742;
    --border: #262C3D;
    --border-soft: #1B2030;
    --text: #E8EAED;
    --text-muted: #838BA0;
    --text-faint: #545C70;
    --accent: #5B8DEF;
    --accent-dim: #2A3E63;
    --urgent: #FF4463;
    --urgent-dim: #4A1F2C;
    --high: #FFA53E;
    --high-dim: #4A3419;
    --medium: #5B8DEF;
    --medium-dim: #1F2C4A;
    --low: #7C8AA3;
    --low-dim: #262C3D;
    --success: #34D399;
    --radius: 10px;
    --shadow-panel: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.4);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body::before{
    content:"";
    position: fixed; inset:0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.05;
    pointer-events: none;
    z-index: 0;
  }

  .shell{
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header.top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand{ display:flex; align-items:center; gap: 10px; }
  .brand__mark{
    width: 32px; height:32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #3A5FC4);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono);
    font-weight:600;
    font-size: 13px;
    color: #fff;
    flex-shrink:0;
    box-shadow: 0 2px 8px -2px rgba(91,141,239,0.5);
  }
  .brand__text{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.01em;
  }
  .brand__sub{
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    margin-top: 1px;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .live-dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--success);
    display:inline-block;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .header-actions{ display:flex; align-items:center; gap: 10px; }

  .bell-btn{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
    font-family: var(--font-body);
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap: 6px;
    transition: all .15s ease;
  }
  .bell-btn:hover{ border-color: var(--accent); color: var(--text); }
  .bell-btn.enabled{ color: var(--success); border-color: var(--success); }

  .tabs{
    display:flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }
  .tab{
    position: relative;
    border:none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tab[aria-selected="true"]{ background: var(--surface-2); color: var(--text); }
  .tab:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab-badge{
    position:absolute;
    top: -4px; right: -2px;
    background: var(--urgent);
    color:#fff;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight:700;
    min-width: 16px; height:16px;
    border-radius: 999px;
    display:flex; align-items:center; justify-content:center;
    padding: 0 3px;
    box-shadow: 0 0 0 2px var(--surface);
  }

  .view{ display:none; }
  .view.active{ display:block; animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform:none; } }

  .panel{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    box-shadow: var(--shadow-panel);
  }
  .panel h1{
    font-family: var(--font-display);
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .panel p.lede{
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 24px;
    line-height: 1.5;
  }

  .field{ margin-bottom: 20px; }
  .field label{
    display:block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  textarea{
    width:100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 12px 14px;
    resize: vertical;
    min-height: 90px;
    line-height: 1.5;
    transition: border-color .15s ease;
  }
  textarea:hover{ border-color: #333B52; }
  textarea:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  textarea::placeholder{ color: var(--text-faint); }

  .priority-picker{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .priority-opt{ position: relative; cursor: pointer; }
  .priority-opt input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .priority-opt .chip{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 6px;
    padding: 12px 4px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    transition: all .15s ease;
  }
  .priority-opt:hover .chip{ border-color: #333B52; }
  .priority-opt .dot{ width:8px; height:8px; border-radius:50%; background: var(--text-muted); }
  .priority-opt[data-p="urgent"] .dot{ background: var(--urgent); }
  .priority-opt[data-p="high"] .dot{ background: var(--high); }
  .priority-opt[data-p="medium"] .dot{ background: var(--medium); }
  .priority-opt[data-p="low"] .dot{ background: var(--low); }

  .priority-opt input:checked + .chip{ color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
  .priority-opt[data-p="urgent"] input:checked + .chip{ border-color: var(--urgent); background: var(--urgent-dim); }
  .priority-opt[data-p="high"] input:checked + .chip{ border-color: var(--high); background: var(--high-dim); }
  .priority-opt[data-p="urgent"] input:checked + .chip .dot{ box-shadow: 0 0 0 4px rgba(255,68,99,0.18); }

  .dropzone{
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    background: var(--surface-2);
    padding: 20px;
    text-align:center;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{ border-color: var(--accent); background: var(--accent-dim); }
  .dropzone input{ display:none; }
  .dropzone .dz-label{ font-size: 13px; color: var(--text-muted); }
  .dropzone .dz-label strong{ color: var(--text); }

  .preview-wrap{ display:none; margin-top: 12px; position: relative; }
  .preview-wrap.show{ display:block; }
  .preview-wrap img{ max-height: 180px; border-radius: 8px; border: 1px solid var(--border); display:block; }
  .preview-wrap button{
    position:absolute; top:8px; right:8px;
    background: rgba(11,14,20,0.85);
    border: 1px solid var(--border);
    color: var(--text);
    width:26px; height:26px;
    border-radius:50%;
    cursor:pointer;
    font-size: 13px;
    line-height:1;
  }

  .submit-btn{
    width:100%;
    background: var(--accent);
    color: #fff;
    border:none;
    border-radius: 8px;
    padding: 13px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 14px;
    cursor:pointer;
    transition: background .15s ease, opacity .15s ease, transform .1s ease;
  }
  .submit-btn:hover{ background: #4A7AE0; }
  .submit-btn:active{ transform: scale(0.99); }
  .submit-btn:disabled{ opacity: 0.5; cursor: default; }

  .err{ color: var(--urgent); font-size: 13px; margin-top: -8px; margin-bottom: 16px; display:none; }
  .err.show{ display:block; }

  .success{ text-align:center; padding: 24px 0 4px; }
  .success .check-badge{
    width: 48px; height:48px;
    border-radius: 50%;
    background: rgba(52,211,153,0.12);
    border: 1.5px solid var(--success);
    color: var(--success);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 14px;
    font-size: 22px;
  }
  .success .ticket-id{
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 600;
    color: var(--accent);
    margin: 4px 0 6px;
  }
  .success p{ color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  .success .again{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    cursor:pointer;
    transition: border-color .15s ease;
  }
  .success .again:hover{ border-color: var(--accent); }

  .queue-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .queue-head h1{ font-family: var(--font-display); font-size: 20px; margin:0; }
  .queue-meta{ display:flex; align-items:center; gap:10px; }
  .queue-count{ font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .refresh-note{ font-size: 11px; color: var(--text-faint); }

  .filters{ display:flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .filter-chip{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 6px 12px;
    border-radius: 999px;
    cursor:pointer;
    transition: all .15s ease;
    display:flex;
    align-items:center;
    gap: 5px;
  }
  .filter-chip:hover{ border-color: #333B52; }
  .filter-chip .count{ opacity: 0.6; }
  .filter-chip.active{ color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
  .filter-chip[data-p="urgent"].active{ border-color: var(--urgent); background: var(--urgent-dim); }
  .filter-chip[data-p="high"].active{ border-color: var(--high); background: var(--high-dim); }

  select.status-select{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    cursor:pointer;
    transition: border-color .15s ease;
  }
  select.status-select:hover{ border-color: #333B52; }

  .ticket-list{ display:flex; flex-direction:column; gap: 12px; }

  .ticket{
    display:flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: opacity .2s ease, transform .2s ease, border-color .15s ease;
  }
  .ticket:hover{ border-color: #333B52; }
  .ticket.removing{ opacity: 0; transform: scale(0.98); }
  .ticket.just-in{ animation: slideIn .35s ease; }
  @keyframes slideIn{
    from{ opacity:0; transform: translateY(-8px); }
    to{ opacity:1; transform:none; }
  }
  .ticket__stub{
    width: 40px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.14em;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    color: #0B0E14;
  }
  .ticket__stub::after{
    content:"";
    position:absolute;
    right:-1px; top:0; bottom:0;
    width:0;
    border-right: 2px dashed rgba(0,0,0,0.25);
  }
  .ticket[data-p="urgent"] .ticket__stub{ background: var(--urgent); }
  .ticket[data-p="high"] .ticket__stub{ background: var(--high); }
  .ticket[data-p="medium"] .ticket__stub{ background: var(--medium); }
  .ticket[data-p="low"] .ticket__stub{ background: var(--low); }

  .ticket__body{ flex:1; padding: 14px 16px; min-width:0; }
  .ticket__meta{ display:flex; align-items:center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .ticket__id{ font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .ticket__time{ font-size: 11px; color: var(--text-faint); }
  .ticket__desc{ font-size: 14px; line-height: 1.5; margin: 0 0 10px; color: var(--text); word-break: break-word; }
  .ticket__thumb{
    max-width: 220px;
    max-height: 140px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    display:block;
    cursor: zoom-in;
    transition: opacity .15s ease;
  }
  .ticket__thumb:hover{ opacity: 0.85; }
  .ticket__footer{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .ticket__actions{ display:flex; align-items:center; gap: 8px; }

  .delete-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .delete-btn:hover{ border-color: var(--urgent); color: var(--urgent); background: var(--urgent-dim); }
  .delete-btn.confirming{ border-color: var(--urgent); color: #fff; background: var(--urgent); }

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: var(--text-muted);
    border: 1px dashed var(--border);
    border-radius: 14px;
  }
  .empty strong{ color: var(--text); display:block; margin-bottom: 6px; font-family: var(--font-display); font-size: 16px; }

  .lightbox{
    display:none;
    position: fixed; inset:0;
    background: rgba(6,8,12,0.9);
    z-index: 50;
    align-items:center;
    justify-content:center;
    padding: 30px;
    cursor: zoom-out;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius: 8px; }

  /* ---------------- Toasts ---------------- */
  .toast-stack{
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 60;
    display:flex;
    flex-direction: column-reverse;
    gap: 10px;
    max-width: calc(100vw - 40px);
  }
  .toast{
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    width: 300px;
    max-width: 100%;
    box-shadow: var(--shadow-panel);
    animation: toastIn .25s ease;
    cursor: pointer;
  }
  .toast[data-p="urgent"]{ border-left-color: var(--urgent); }
  .toast[data-p="high"]{ border-left-color: var(--high); }
  .toast[data-p="medium"]{ border-left-color: var(--medium); }
  .toast[data-p="low"]{ border-left-color: var(--low); }
  .toast.leaving{ animation: toastOut .2s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform: translateX(16px);} to{ opacity:1; transform:none; } }
  @keyframes toastOut{ from{ opacity:1; } to{ opacity:0; transform: translateX(16px); } }
  .toast__title{ font-size: 12px; font-weight:700; color: var(--text-muted); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.06em; margin-bottom: 4px; }
  .toast__desc{ font-size: 13px; color: var(--text); line-height:1.4; }

  @media (max-width: 480px){
    .priority-picker{ grid-template-columns: repeat(2,1fr); }
    .shell{ padding: 20px 14px 60px; }
    .toast-stack{ right: 12px; left: 12px; }
    .toast{ width: auto; }
  }
</style>

<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="brand__mark">BD</div>
      <div>
        <div class="brand__text">Bug Desk</div>
        <div class="brand__sub"><span class="live-dot" id="live-dot"></span><span id="subline">flag it, we'll fix it</span></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="bell-btn" id="bell-btn" title="Get notified of new tickets">🔔 Enable alerts</button>
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-submit" role="tab" aria-selected="true">Report a bug</button>
        <button class="tab" id="tab-queue" role="tab" aria-selected="false">
          Queue
          <span class="tab-badge" id="tab-badge" style="display:none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- SUBMIT VIEW -->
  <section class="view active" id="view-submit">
    <div class="panel" id="submit-panel">
      <h1>What's broken?</h1>
      <p class="lede">Drop a screenshot and a quick description. Mark it Urgent only if it's actually blocking something right now.</p>

      <form id="bug-form">
        <div class="field">
          <label for="desc">What's happening</label>
          <textarea id="desc" placeholder="e.g. Checkout button does nothing on mobile Safari" required></textarea>
        </div>

        <div class="field">
          <label>Priority</label>
          <div class="priority-picker">
            <label class="priority-opt" data-p="low">
              <input type="radio" name="priority" value="low">
              <span class="chip"><span class="dot"></span>Low</span>
            </label>
            <label class="priority-opt" data-p="medium">
              <input type="radio" name="priority" value="medium" checked>
              <span class="chip"><span class="dot"></span>Medium</span>
            </label>
            <label class="priority-opt" data-p="high">
              <input type="radio" name="priority" value="high">
              <span class="chip"><span class="dot"></span>High</span>
            </label>
            <label class="priority-opt" data-p="urgent">
              <input type="radio" name="priority" value="urgent">
              <span class="chip"><span class="dot"></span>Urgent</span>
            </label>
          </div>
        </div>

        <div class="field">
          <label>Screenshot</label>
          <div class="dropzone" id="dropzone">
            <input type="file" id="file-input" accept="image/*">
            <div class="dz-label" id="dz-label"><strong>Click to upload</strong> or drag an image here</div>
          </div>
          <div class="preview-wrap" id="preview-wrap">
            <img id="preview-img" alt="Screenshot preview">
            <button type="button" id="remove-img" aria-label="Remove image">✕</button>
          </div>
        </div>

        <div class="err" id="form-err"></div>

        <button type="submit" class="submit-btn" id="submit-btn">File ticket</button>
      </form>
    </div>

    <div class="panel success" id="success-panel" style="display:none;">
      <div class="check-badge">✓</div>
      <div style="font-size:13px;color:var(--text-muted);font-family:var(--font-mono);">TICKET FILED</div>
      <div class="ticket-id" id="new-ticket-id">BD-0000</div>
      <p id="new-ticket-priority">Priority: Medium</p>
      <button class="again" id="file-another">File another</button>
    </div>
  </section>

  <!-- QUEUE VIEW -->
  <section class="view" id="view-queue">
    <div class="queue-head">
      <h1>The queue</h1>
      <div class="queue-meta">
        <span class="queue-count" id="queue-count">0 open</span>
        <span class="refresh-note" id="refresh-note"></span>
      </div>
    </div>
    <div class="filters" id="filters">
      <button class="filter-chip active" data-p="all">ALL <span class="count" id="count-all"></span></button>
      <button class="filter-chip" data-p="urgent">URGENT <span class="count" id="count-urgent"></span></button>
      <button class="filter-chip" data-p="high">HIGH <span class="count" id="count-high"></span></button>
      <button class="filter-chip" data-p="medium">MEDIUM <span class="count" id="count-medium"></span></button>
      <button class="filter-chip" data-p="low">LOW <span class="count" id="count-low"></span></button>
    </div>
    <div class="ticket-list" id="ticket-list"></div>
  </section>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>
<div class="toast-stack" id="toast-stack"></div>

<script>
(function(){
  const CFG = window.CONFIG;
  const REST = CFG.SUPABASE_URL + "/rest/v1/bugs";
  const STORAGE = CFG.SUPABASE_URL + "/storage/v1/object/screenshots/";
  const STORAGE_PUBLIC = CFG.SUPABASE_URL + "/storage/v1/object/public/screenshots/";
  const headers = {
    "apikey": CFG.SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + CFG.SUPABASE_ANON_KEY
  };
  const configured = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("YOUR_");
  const ORIGINAL_TITLE = document.title;

  // ---------- Tabs ----------
  const tabSubmit = document.getElementById('tab-submit');
  const tabQueue = document.getElementById('tab-queue');
  const viewSubmit = document.getElementById('view-submit');
  const viewQueue = document.getElementById('view-queue');
  const tabBadge = document.getElementById('tab-badge');

  function showView(name){
    const isQueue = name === 'queue';
    tabSubmit.setAttribute('aria-selected', String(!isQueue));
    tabQueue.setAttribute('aria-selected', String(isQueue));
    viewSubmit.classList.toggle('active', !isQueue);
    viewQueue.classList.toggle('active', isQueue);
    if(isQueue){
      loadTickets();
      unreadCount = 0;
      updateBadge();
    }
  }
  tabSubmit.addEventListener('click', () => showView('submit'));
  tabQueue.addEventListener('click', () => showView('queue'));

  if(window.location.hash === '#queue'){ showView('queue'); }

  // ---------- Notification permission ----------
  const bellBtn = document.getElementById('bell-btn');
  function refreshBellState(){
    if(!('Notification' in window)){
      bellBtn.style.display = 'none';
      return;
    }
    if(Notification.permission === 'granted'){
      bellBtn.textContent = '🔔 Alerts on';
      bellBtn.classList.add('enabled');
    } else if(Notification.permission === 'denied'){
      bellBtn.textContent = '🔕 Blocked in browser';
      bellBtn.classList.remove('enabled');
    } else {
      bellBtn.textContent = '🔔 Enable alerts';
      bellBtn.classList.remove('enabled');
    }
  }
  bellBtn.addEventListener('click', () => {
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default'){
      Notification.requestPermission().then(refreshBellState);
    }
  });
  refreshBellState();

  // ---------- Sound alert (no audio file needed) ----------
  function playBeep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    }catch(e){ /* audio not available, fail silently */ }
  }

  // ---------- Tab title flash while hidden ----------
  let flashTimer = null;
  function startFlash(){
    if(flashTimer) return;
    let on = false;
    flashTimer = setInterval(() => {
      document.title = on ? ORIGINAL_TITLE : '🔴 New ticket! — Bug Desk';
      on = !on;
    }, 1200);
  }
  function stopFlash(){
    if(flashTimer){ clearInterval(flashTimer); flashTimer = null; }
    document.title = ORIGINAL_TITLE;
  }
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) stopFlash();
  });

  // ---------- Toasts ----------
  const toastStack = document.getElementById('toast-stack');
  function showToast(ticket){
    const el = document.createElement('div');
    el.className = 'toast';
    el.dataset.p = ticket.priority;
    el.innerHTML = `
      <div class="toast__title">New ${ticket.priority} ticket</div>
      <div class="toast__desc">${escapeHtml(ticket.description).slice(0,120)}</div>
    `;
    el.addEventListener('click', () => {
      showView('queue');
      el.remove();
    });
    toastStack.appendChild(el);
    setTimeout(() => {
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 220);
    }, 6000);
  }

  // ---------- Unread badge ----------
  let unreadCount = 0;
  function updateBadge(){
    if(unreadCount > 0){
      tabBadge.style.display = 'flex';
      tabBadge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
    } else {
      tabBadge.style.display = 'none';
    }
  }

  // ---------- New-ticket alert pipeline ----------
  let knownIds = null; // null = not yet initialized (first poll just baselines, no alerts)

  function handleNewTickets(fresh){
    if(fresh.length === 0) return;
    fresh.forEach(t => {
      showToast(t);
      const notifPermitted = ('Notification' in window) && Notification.permission === 'granted';
      if(notifPermitted){
        try{
          const n = new Notification('Bug Desk — new ' + t.priority + ' ticket', {
            body: t.description.slice(0, 140)
          });
          n.onclick = () => { window.focus(); showView('queue'); n.close(); };
        }catch(e){}
      }
    });
    playBeep();
    if(document.hidden) startFlash();
    if(!viewQueue.classList.contains('active')){
      unreadCount += fresh.length;
      updateBadge();
    }
  }

  // ---------- Polling ----------
  const POLL_MS = 15000;
  const refreshNote = document.getElementById('refresh-note');

  async function poll(){
    if(!configured) return;
    try{
      const res = await fetch(REST + '?select=*&order=created_at.desc', { headers });
      if(!res.ok) return;
      const data = await res.json();

      if(knownIds === null){
        knownIds = new Set(data.map(t => t.id));
      } else {
        const fresh = data.filter(t => !knownIds.has(t.id));
        fresh.forEach(t => knownIds.add(t.id));
        if(fresh.length){
          handleNewTickets(fresh);
        }
      }

      allTickets = data;
      if(viewQueue.classList.contains('active')){
        render();
        refreshNote.textContent = 'updated just now';
      }
    }catch(e){ /* network hiccup, next poll will retry */ }
  }
  setInterval(poll, POLL_MS);
  poll(); // baseline immediately on load

  // ---------- Submit form ----------
  const form = document.getElementById('bug-form');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg = document.getElementById('preview-img');
  const removeImgBtn = document.getElementById('remove-img');
  const dzLabel = document.getElementById('dz-label');
  const formErr = document.getElementById('form-err');
  const submitBtn = document.getElementById('submit-btn');
  let selectedFile = null;

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if(fileInput.files[0]) handleFile(fileInput.files[0]); });

  const MAX_DIM = 1600;
  const JPEG_QUALITY = 0.72;

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read image'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not decode image'));
        img.onload = () => {
          let w = img.naturalWidth, h = img.naturalHeight;
          if(w > maxDim || h > maxDim){
            if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
            else{ w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => {
            if(!blob){ reject(new Error('Compression failed')); return; }
            resolve(blob);
          }, 'image/jpeg', quality);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function formatKB(bytes){ return Math.max(1, Math.round(bytes / 1024)) + ' KB'; }

  async function handleFile(file){
    if(!file.type.startsWith('image/')) return;
    const originalSize = file.size;
    dzLabel.innerHTML = '<strong>Compressing…</strong>';
    try{
      const compressed = await compressImage(file, MAX_DIM, JPEG_QUALITY);
      selectedFile = compressed;
      const url = URL.createObjectURL(compressed);
      previewImg.src = url;
      previewWrap.classList.add('show');
      dzLabel.innerHTML = '<strong>' + formatKB(compressed.size) + '</strong> (was ' + formatKB(originalSize) + ') — ready to send';
    }catch(err){
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewWrap.classList.add('show');
        dzLabel.innerHTML = '<strong>' + file.name + '</strong> selected';
      };
      reader.readAsDataURL(file);
    }
  }

  removeImgBtn.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    previewWrap.classList.remove('show');
    dzLabel.innerHTML = '<strong>Click to upload</strong> or drag an image here';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formErr.classList.remove('show');

    if(!configured){
      formErr.textContent = "This Bug Desk isn't connected to a database yet — see the setup notes in the file.";
      formErr.classList.add('show');
      return;
    }

    const desc = document.getElementById('desc').value.trim();
    const priority = form.querySelector('input[name="priority"]:checked').value;
    if(!desc){ return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Filing…";

    try{
      let imageUrl = null;
      if(selectedFile){
        const ext = selectedFile.type === 'image/jpeg' ? 'jpg' : (selectedFile.name ? selectedFile.name.split('.').pop() : 'png');
        const fname = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
        const uploadRes = await fetch(STORAGE + fname, {
          method: 'POST',
          headers: { ...headers, 'Content-Type': selectedFile.type || 'image/jpeg' },
          body: selectedFile
        });
        if(!uploadRes.ok) throw new Error('Image upload failed');
        imageUrl = STORAGE_PUBLIC + fname;
      }

      const insertRes = await fetch(REST, {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({ description: desc, priority, image_url: imageUrl })
      });
      if(!insertRes.ok) throw new Error('Could not file ticket');
      const [created] = await insertRes.json();

      // let the poller pick this up naturally on its next tick,
      // but mark it known now so the reporter doesn't get a toast for their own ticket
      if(knownIds) knownIds.add(created.id);

      document.getElementById('submit-panel').style.display = 'none';
      document.getElementById('success-panel').style.display = 'block';
      document.getElementById('new-ticket-id').textContent = ticketId(created);
      document.getElementById('new-ticket-priority').textContent = 'Priority: ' + capitalize(priority);

    }catch(err){
      formErr.textContent = "Something went wrong — " + err.message + ". Try again?";
      formErr.classList.add('show');
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = "File ticket";
    }
  });

  document.getElementById('file-another').addEventListener('click', () => {
    form.reset();
    selectedFile = null;
    previewWrap.classList.remove('show');
    dzLabel.innerHTML = '<strong>Click to upload</strong> or drag an image here';
    document.getElementById('submit-panel').style.display = 'block';
    document.getElementById('success-panel').style.display = 'none';
  });

  // ---------- Queue ----------
  const ticketList = document.getElementById('ticket-list');
  const queueCount = document.getElementById('queue-count');
  const filters = document.getElementById('filters');
  let activeFilter = 'all';
  let allTickets = [];

  filters.addEventListener('click', e => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    activeFilter = btn.dataset.p;
    [...filters.children].forEach(c => c.classList.toggle('active', c === btn));
    render();
  });

  const priorityRank = { urgent: 0, high: 1, medium: 2, low: 3 };

  async function loadTickets(){
    if(!configured){
      ticketList.innerHTML = '<div class="empty"><strong>Not connected yet</strong>Add your Supabase URL and anon key at the top of this file to start collecting tickets.</div>';
      queueCount.textContent = '';
      return;
    }
    if(allTickets.length === 0){
      ticketList.innerHTML = '<div class="empty">Loading…</div>';
    }
    try{
      const res = await fetch(REST + '?select=*&order=created_at.desc', { headers });
      if(!res.ok) throw new Error('fetch failed');
      allTickets = await res.json();
      render();
    }catch(err){
      ticketList.innerHTML = '<div class="empty"><strong>Couldn\'t load the queue</strong>Check your Supabase config and RLS policies.</div>';
    }
  }

  function updateCounts(){
    const counts = { urgent:0, high:0, medium:0, low:0 };
    allTickets.forEach(t => { if(counts[t.priority] !== undefined) counts[t.priority]++; });
    document.getElementById('count-all').textContent = allTickets.length || '';
    document.getElementById('count-urgent').textContent = counts.urgent || '';
    document.getElementById('count-high').textContent = counts.high || '';
    document.getElementById('count-medium').textContent = counts.medium || '';
    document.getElementById('count-low').textContent = counts.low || '';
  }

  function render(){
    updateCounts();
    let list = allTickets.filter(t => activeFilter === 'all' || t.priority === activeFilter);
    list.sort((a,b) => (priorityRank[a.priority] ?? 9) - (priorityRank[b.priority] ?? 9) || new Date(b.created_at) - new Date(a.created_at));

    const openCount = allTickets.filter(t => t.status !== 'fixed').length;
    queueCount.textContent = openCount + ' open';

    if(list.length === 0){
      ticketList.innerHTML = '<div class="empty"><strong>Clear board</strong>No tickets match this filter.</div>';
      return;
    }

    ticketList.innerHTML = list.map(t => `
      <div class="ticket" data-p="${t.priority}" data-id="${t.id}">
        <div class="ticket__stub">${t.priority.toUpperCase()}</div>
        <div class="ticket__body">
          <div class="ticket__meta">
            <span class="ticket__id">${ticketId(t)}</span>
            <span class="ticket__time">${timeAgo(t.created_at)}</span>
          </div>
          <p class="ticket__desc">${escapeHtml(t.description)}</p>
          ${t.image_url ? `<img class="ticket__thumb" src="${t.image_url}" data-full="${t.image_url}" alt="Screenshot">` : ''}
          <div class="ticket__footer">
            <select class="status-select" data-id="${t.id}">
              <option value="new" ${t.status==='new'?'selected':''}>New</option>
              <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option>
              <option value="fixed" ${t.status==='fixed'?'selected':''}>Fixed</option>
            </select>
            <div class="ticket__actions">
              <button type="button" class="delete-btn" data-id="${t.id}" data-image="${t.image_url || ''}">Delete</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  ticketList.addEventListener('change', async e => {
    if(!e.target.classList.contains('status-select')) return;
    const id = e.target.dataset.id;
    const status = e.target.value;
    try{
      await fetch(REST + '?id=eq.' + id, {
        method: 'PATCH',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      const t = allTickets.find(x => x.id === id);
      if(t) t.status = status;
      render();
    }catch(err){}
  });

  ticketList.addEventListener('click', async e => {
    const img = e.target.closest('.ticket__thumb');
    if(img){
      document.getElementById('lightbox-img').src = img.dataset.full;
      document.getElementById('lightbox').classList.add('show');
      return;
    }

    const delBtn = e.target.closest('.delete-btn');
    if(!delBtn) return;

    if(!delBtn.classList.contains('confirming')){
      delBtn.classList.add('confirming');
      delBtn.textContent = 'Confirm delete?';
      delBtn.dataset.confirmTimer = setTimeout(() => {
        delBtn.classList.remove('confirming');
        delBtn.textContent = 'Delete';
      }, 3000);
      return;
    }

    clearTimeout(delBtn.dataset.confirmTimer);
    const id = delBtn.dataset.id;
    const imageUrl = delBtn.dataset.image;
    const ticketEl = delBtn.closest('.ticket');
    delBtn.disabled = true;
    delBtn.textContent = 'Deleting…';

    try{
      await fetch(REST + '?id=eq.' + id, { method: 'DELETE', headers });

      if(imageUrl){
        const fname = imageUrl.split('/screenshots/')[1];
        if(fname){
          await fetch(STORAGE + fname, { method: 'DELETE', headers }).catch(() => {});
        }
      }

      allTickets = allTickets.filter(t => t.id !== id);
      if(knownIds) knownIds.delete(id);
      if(ticketEl){
        ticketEl.classList.add('removing');
        setTimeout(() => render(), 200);
      } else {
        render();
      }
    }catch(err){
      delBtn.disabled = false;
      delBtn.classList.remove('confirming');
      delBtn.textContent = 'Delete';
    }
  });

  document.getElementById('lightbox').addEventListener('click', function(){ this.classList.remove('show'); });

  function ticketId(t){
    return 'BD-' + (t.id || '').toString().replace(/-/g,'').slice(0,4).toUpperCase();
  }
  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function timeAgo(iso){
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }

  if(!configured){
    document.getElementById('subline').textContent = 'not connected — see setup notes';
    document.getElementById('live-dot').style.background = 'var(--text-faint)';
  }
})();
</script>
</body>
</html>

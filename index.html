<style>
  :root{
    --bg: #0B0E14;
    --surface: #131722;
    --surface-2: #1B2030;
    --surface-3: #202742;
    --border: #262C3D;

    --text: #E8EAED;

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{

    color: var(--text);

  }

  body::before{

    pointer-events: none;
    z-index: 0;

  .shell{

  header.top{

  .brand{ display:flex; align-items:center; gap: 10px; }
  .brand__mark{

  .brand__text{

    letter-spacing: -0.01em;
  }
  .brand__sub{
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    margin-top: 1px;
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .live-dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--success);
    display:inline-block;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

  .header-actions{ display:flex; align-items:center; gap: 10px; }

  .bell-btn{
    background: var(--surface);
    border: 1px solid var(--border);

  .bell-btn:hover{ border-color: var(--accent); color: var(--text); }
  .bell-btn.enabled{ color: var(--success); border-color: var(--success); }

  .tabs{

    gap: 4px;

  textarea:hover{ border-color: #333B52; }
  textarea:focus-visible, input:focus-visible, select:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  textarea::placeholder{ color: var(--text-faint); }

  .priority-picker{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .priority-opt{ position: relative; cursor: pointer; }
  .priority-opt input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .priority-opt .chip{

  .priority-opt:hover .chip{ border-color: #333B52; }
  .priority-opt .dot{ width:8px; height:8px; border-radius:50%; background: var(--text-muted); }
  .priority-opt[data-p="urgent"] .dot{ background: var(--urgent); }
  .priority-opt[data-p="high"] .dot{ background: var(--high); }
  .priority-opt[data-p="medium"] .dot{ background: var(--medium); }
  .priority-opt[data-p="low"] .dot{ background: var(--low); }

  .priority-opt input:checked + .chip{ color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
  .priority-opt[data-p="urgent"] input:checked + .chip{ border-color: var(--urgent); background: var(--urgent-dim); }
  .priority-opt[data-p="high"] input:checked + .chip{ border-color: var(--high); background: var(--high-dim); }
  .priority-opt[data-p="urgent"] input:checked + .chip .dot{ box-shadow: 0 0 0 4px rgba(255,68,99,0.18); }

  .dropzone .dz-label strong{ color: var(--text); }

  .preview-grid{

  .preview-item button{
    position:absolute; top:5px; right:5px;

  .preview-item.compressing{ display:flex; align-items:center; justify-content:center; color: var(--text-faint); font-size: 10px; }

  .submit-btn{

  .queue-head{

    gap: 10px;

  .filters{ display:flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .filter-chip{

    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 6px 12px;

    cursor:pointer;
    transition: all .15s ease;
    display:flex;
    align-items:center;
    gap: 5px;
  }
  .filter-chip:hover{ border-color: #333B52; }
  .filter-chip .count{ opacity: 0.6; }
  .filter-chip.active{ color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
  .filter-chip[data-p="urgent"].active{ border-color: var(--urgent); background: var(--urgent-dim); }
  .filter-chip[data-p="high"].active{ border-color: var(--high); background: var(--high-dim); }

  select.status-select{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 6px;
    cursor:pointer;
    transition: border-color .15s ease;
  }
  select.status-select:hover{ border-color: #333B52; }

  .ticket-list{ display:flex; flex-direction:column; gap: 12px; }

  .ticket{
    display:flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: opacity .2s ease, transform .2s ease, border-color .15s ease;
  }
  .ticket:hover{ border-color: #333B52; }
  .ticket.removing{ opacity: 0; transform: scale(0.98); }
  .ticket.just-in{ animation: slideIn .35s ease; }
  @keyframes slideIn{
    from{ opacity:0; transform: translateY(-8px); }
    to{ opacity:1; transform:none; }
  }
  .ticket__stub{
    width: 40px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.14em;
    writing-mode: vertical-rl;

  }
  .ticket__stub::after{

  .ticket__body{ flex:1; padding: 14px 16px; min-width:0; }
  .ticket__meta{ display:flex; align-items:center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .ticket__id{ font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .ticket__time{ font-size: 11px; color: var(--text-faint); }

  .ticket__gallery{ display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .ticket__thumb{

  .ticket__footer{

    flex-wrap: wrap;

  .ticket__actions{ display:flex; align-items:center; gap: 8px; }

  .delete-btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);

  .delete-btn:hover{ border-color: var(--urgent); color: var(--urgent); background: var(--urgent-dim); }

  /* ---------------- Comment threads ---------------- */

  }
  .toast{
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    width: 300px;
    max-width: 100%;
    box-shadow: var(--shadow-panel);
    animation: toastIn .25s ease;
    cursor: pointer;
  }
  .toast[data-p="urgent"]{ border-left-color: var(--urgent); }
  .toast[data-p="high"]{ border-left-color: var(--high); }
  .toast[data-p="medium"]{ border-left-color: var(--medium); }
  .toast[data-p="low"]{ border-left-color: var(--low); }
  .toast.leaving{ animation: toastOut .2s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform: translateX(16px);} to{ opacity:1; transform:none; } }
  @keyframes toastOut{ from{ opacity:1; } to{ opacity:0; transform: translateX(16px); } }
  .toast__title{ font-size: 12px; font-weight:700; color: var(--text-muted); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.06em; margin-bottom: 4px; }
  .toast__desc{ font-size: 13px; color: var(--text); line-height:1.4; }

  @media (max-width: 480px){
    .priority-picker{ grid-template-columns: repeat(2,1fr); }
    .shell{ padding: 20px 14px 60px; }
    .toast-stack{ right: 12px; left: 12px; }
    .toast{ width: auto; }
  }
</style>

<div class="toast-stack" id="toast-stack"></div>

<script>
(function(){
  const CFG = window.CONFIG;
  const REST = CFG.SUPABASE_URL + "/rest/v1/bugs";
  const STORAGE = CFG.SUPABASE_URL + "/storage/v1/object/screenshots/";
  const STORAGE_PUBLIC = CFG.SUPABASE_URL + "/storage/v1/object/public/screenshots/";
  const COMMENTS_REST = CFG.SUPABASE_URL + "/rest/v1/comments";
  const headers = {
    "apikey": CFG.SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + CFG.SUPABASE_ANON_KEY
  };
  const configured = CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("YOUR_");
  const ORIGINAL_TITLE = document.title;

  // ---------- Tabs ----------
  const tabSubmit = document.getElementById('tab-submit');
  const tabMine = document.getElementById('tab-mine');
  const tabQueue = document.getElementById('tab-queue');
  const viewSubmit = document.getElementById('view-submit');
  const viewMine = document.getElementById('view-mine');
  const viewQueue = document.getElementById('view-queue');
  const tabBadge = document.getElementById('tab-badge');

  function showView(name){
    tabSubmit.setAttribute('aria-selected', String(name === 'submit'));
    tabMine.setAttribute('aria-selected', String(name === 'mine'));
    tabQueue.setAttribute('aria-selected', String(name === 'queue'));
    viewSubmit.classList.toggle('active', name === 'submit');
    viewMine.classList.toggle('active', name === 'mine');
    viewQueue.classList.toggle('active', name === 'queue');
    if(name === 'queue'){
      loadTickets();
      unreadCount = 0;
      updateBadge();
    }
    if(name === 'mine'){
      renderMine();
      mineUnread = 0;
      updateMineBadge();
    }
  }
  tabSubmit.addEventListener('click', () => showView('submit'));
  tabMine.addEventListener('click', () => showView('mine'));
  tabQueue.addEventListener('click', () => showView('queue'));

  // NOTE: hash-based view switch (#queue / #mine) happens at the very end of
  // this script, once all state below has been initialized — see bottom.

  // ---------- Anonymous reporter identity ----------
  // No login for reporters, so we keep a random ID in this browser's
  // localStorage — same pattern support tools like Zendesk/Canny use for
  // "guest" ticket tracking. It only works on the same browser/device.
  function getReporterId(){
    let id = localStorage.getItem('bugdesk_reporter_id');
    if(!id){
      id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + '-' + Math.random().toString(36).slice(2)));
      localStorage.setItem('bugdesk_reporter_id', id);
    }
    return id;
  }
  const REPORTER_ID = getReporterId();

  // ---------- Notification permission ----------
  const bellBtn = document.getElementById('bell-btn');
  function refreshBellState(){
    if(!('Notification' in window)){
      bellBtn.style.display = 'none';
      return;
    }
    if(Notification.permission === 'granted'){
      bellBtn.textContent = '🔔 Alerts on';
      bellBtn.classList.add('enabled');
    } else if(Notification.permission === 'denied'){
      bellBtn.textContent = '🔕 Blocked in browser';
      bellBtn.classList.remove('enabled');
    } else {
      bellBtn.textContent = '🔔 Enable alerts';
      bellBtn.classList.remove('enabled');
    }
  }
  bellBtn.addEventListener('click', () => {
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default'){
      Notification.requestPermission().then(refreshBellState);
    }
  });
  refreshBellState();

  // ---------- Sound alert (no audio file needed) ----------
  function playBeep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.4);
    }catch(e){ /* audio not available, fail silently */ }
  }

  // ---------- Tab title flash while hidden ----------
  let flashTimer = null;
  function startFlash(){
    if(flashTimer) return;
    let on = false;
    flashTimer = setInterval(() => {
      document.title = on ? ORIGINAL_TITLE : '🔴 New ticket! — Bug Desk';
      on = !on;
    }, 1200);
  }
  function stopFlash(){
    if(flashTimer){ clearInterval(flashTimer); flashTimer = null; }
    document.title = ORIGINAL_TITLE;
  }
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) stopFlash();
  });

  // ---------- Toasts ----------
  const toastStack = document.getElementById('toast-stack');
  function showToast(ticket){
    const el = document.createElement('div');
    el.className = 'toast';
    el.dataset.p = ticket.priority;
    el.innerHTML = `
      <div class="toast__title">New ${ticket.priority} ticket</div>
      <div class="toast__desc">${escapeHtml(ticket.description).slice(0,120)}</div>
    `;
    el.addEventListener('click', () => {
      showView('queue');
      el.remove();
    });
    toastStack.appendChild(el);
    setTimeout(() => {
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 220);
    }, 6000);
  }

  // ---------- Unread badge ----------
  let unreadCount = 0;
  function updateBadge(){
    if(unreadCount > 0){
      tabBadge.style.display = 'flex';
      tabBadge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
    } else {
      tabBadge.style.display = 'none';
    }
  }

  let mineUnread = 0;
  const mineBadge = document.getElementById('mine-badge');
  function updateMineBadge(){
    if(mineUnread > 0){
      mineBadge.style.display = 'flex';
      mineBadge.textContent = mineUnread > 9 ? '9+' : String(mineUnread);
    } else {
      mineBadge.style.display = 'none';
    }
  }

  // ---------- New-ticket alert pipeline ----------
  let knownIds = null; // null = not yet initialized (first poll just baselines, no alerts)

  function handleNewTickets(fresh){
    if(fresh.length === 0) return;
    fresh.forEach(t => {
      showToast(t);
      const notifPermitted = ('Notification' in window) && Notification.permission === 'granted';
      if(notifPermitted){
        try{
          const n = new Notification('Bug Desk — new ' + t.priority + ' ticket', {
            body: t.description.slice(0, 140)
          });
          n.onclick = () => { window.focus(); showView('queue'); n.close(); };
        }catch(e){}
      }
    });
    playBeep();
    if(document.hidden) startFlash();
    if(!viewQueue.classList.contains('active')){
      unreadCount += fresh.length;
      updateBadge();
    }
  }

  // ---------- Comments ----------
  let commentsByBug = {}; // bugId -> array of comments, oldest first
  let knownCommentIds = null; // for new-comment detection, same pattern as knownIds
  const SEEN_KEY = 'bugdesk_seen_comments'; // { [bugId]: count } persisted per browser

  function getSeenMap(){
    try{ return JSON.parse(localStorage.getItem(SEEN_KEY) || '{}'); }catch(e){ return {}; }
  }
  function markSeen(bugId, count){
    const map = getSeenMap();
    map[bugId] = count;
    localStorage.setItem(SEEN_KEY, JSON.stringify(map));
  }

  async function fetchComments(){
    if(!configured) return;
    try{
      const res = await fetch(COMMENTS_REST + '?select=*&order=created_at.asc', { headers });
      if(!res.ok) return;
      const data = await res.json();
      const grouped = {};
      data.forEach(c => {
        if(!grouped[c.bug_id]) grouped[c.bug_id] = [];
        grouped[c.bug_id].push(c);
      });

      if(knownCommentIds === null){
        knownCommentIds = new Set(data.map(c => c.id));
      } else {
        const freshComments = data.filter(c => !knownCommentIds.has(c.id));
        freshComments.forEach(c => knownCommentIds.add(c.id));
        // If a reporter replies while we (admin) are away from the queue tab, badge it.
        const newReporterReplies = freshComments.filter(c => c.author_type === 'reporter');
        if(newReporterReplies.length && !viewQueue.classList.contains('active')){
          unreadCount += newReporterReplies.length;
          updateBadge();
          playBeep();
        }
        // If admin replies to one of "my" tickets while I'm elsewhere, badge My Tickets.
        const newAdminReplies = freshComments.filter(c => {
          if(c.author_type !== 'admin') return false;
          const bug = allTickets.find(t => t.id === c.bug_id);
          return bug && bug.reporter_id === REPORTER_ID;
        });
        if(newAdminReplies.length && !viewMine.classList.contains('active')){
          mineUnread += newAdminReplies.length;
          updateMineBadge();
        }
      }
      commentsByBug = grouped;
    }catch(e){ /* next poll retries */ }
  }

  async function postComment(bugId, message, authorType, authorName){
    const payload = {
      bug_id: bugId,
      author_type: authorType,
      author_name: authorName || (authorType === 'admin' ? 'Bug Desk team' : 'You'),
      message
    };
    const res = await fetch(COMMENTS_REST, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('Could not send comment');
    const [created] = await res.json();
    if(!commentsByBug[bugId]) commentsByBug[bugId] = [];
    commentsByBug[bugId].push(created);
    if(knownCommentIds) knownCommentIds.add(created.id);
    return created;
  }

  function commentThreadHtml(bugId){
    const comments = commentsByBug[bugId] || [];
    const listHtml = comments.length
      ? comments.map(c => `
          <div class="comment-row" data-author="${c.author_type}">
            <div class="comment-avatar">${c.author_type === 'admin' ? 'BD' : (c.author_name || 'R').slice(0,2).toUpperCase()}</div>
            <div class="comment-bubble">
              <div class="comment-bubble__meta">
                <span class="comment-bubble__author">${escapeHtml(c.author_name || (c.author_type === 'admin' ? 'Bug Desk team' : 'Reporter'))}</span>
                <span class="comment-bubble__time">${timeAgo(c.created_at)}</span>
              </div>
              <div class="comment-bubble__msg">${escapeHtml(c.message)}</div>
            </div>
          </div>
        `).join('')
      : '<div class="comment-empty">No comments yet — say something.</div>';

    return `
      <div class="comment-list">${listHtml}</div>
      <form class="comment-form" data-bug-id="${bugId}">
        <input type="text" placeholder="Write a comment…" maxlength="500" required>
        <button type="submit">Send</button>
      </form>
    `;
  }

  function commentCountFor(bugId){
    return (commentsByBug[bugId] || []).length;
  }
  function hasUnseenComments(bugId){
    const seen = getSeenMap();
    return commentCountFor(bugId) > (seen[bugId] || 0);
  }

  // ---------- Polling ----------
  const POLL_MS = 15000;
  const refreshNote = document.getElementById('refresh-note');

  async function poll(){
    if(!configured) return;
    try{
      const res = await fetch(REST + '?select=*&order=created_at.desc', { headers });
      if(!res.ok) return;
      const data = await res.json();

      if(knownIds === null){
        knownIds = new Set(data.map(t => t.id));
      } else {
        const fresh = data.filter(t => !knownIds.has(t.id));
        fresh.forEach(t => knownIds.add(t.id));
        if(fresh.length){
          handleNewTickets(fresh);
        }
      }

      allTickets = data;
      await fetchComments();

      if(viewQueue.classList.contains('active')){
        render();
        refreshNote.textContent = 'updated just now';
      }
      if(viewMine.classList.contains('active')){
        renderMine();
      }
    }catch(e){ /* network hiccup, next poll will retry */ }
  }
  setInterval(poll, POLL_MS);
  poll(); // baseline immediately on load

  // ---------- Submit form ----------
  const form = document.getElementById('bug-form');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const previewGrid = document.getElementById('preview-grid');
  const dzLabel = document.getElementById('dz-label');
  const formErr = document.getElementById('form-err');
  const submitBtn = document.getElementById('submit-btn');
  const MAX_IMAGES = 4;
  let selectedImages = []; // [{ blob, url, kbLabel }]

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    handleFiles(Array.from(e.dataTransfer.files || []));
  });
  fileInput.addEventListener('change', () => {
    handleFiles(Array.from(fileInput.files || []));
    fileInput.value = ''; // allow re-selecting the same file later
  });

  const MAX_DIM = 1600;
  const JPEG_QUALITY = 0.72;

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read image'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not decode image'));
        img.onload = () => {
          let w = img.naturalWidth, h = img.naturalHeight;
          if(w > maxDim || h > maxDim){
            if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
            else{ w = Math.round(w * maxDim / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => {
            if(!blob){ reject(new Error('Compression failed')); return; }
            resolve(blob);
          }, 'image/jpeg', quality);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function formatKB(bytes){ return Math.max(1, Math.round(bytes / 1024)) + ' KB'; }

  function renderPreviewGrid(){
    previewGrid.innerHTML = selectedImages.map((img, i) => `
      <div class="preview-item">
        <img src="${img.url}" alt="Screenshot ${i+1}">
        ${img.kbLabel ? `<span class="kb-tag">${img.kbLabel}</span>` : ''}
        <button type="button" data-idx="${i}" aria-label="Remove image">✕</button>
      </div>
    `).join('');
    updateDzLabel();
  }

  function updateDzLabel(){
    if(selectedImages.length === 0){
      dzLabel.innerHTML = '<strong>Click to upload</strong> or drag images here';
    } else if(selectedImages.length >= MAX_IMAGES){
      dzLabel.innerHTML = '<strong>' + selectedImages.length + '/' + MAX_IMAGES + '</strong> — that\'s the max for one ticket';
    } else {
      dzLabel.innerHTML = '<strong>' + selectedImages.length + '</strong> selected — add up to ' + (MAX_IMAGES - selectedImages.length) + ' more';
    }
  }

  previewGrid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-idx]');
    if(!btn) return;
    const idx = Number(btn.dataset.idx);
    selectedImages.splice(idx, 1);
    renderPreviewGrid();
  });

  async function handleFiles(files){
    const imageFiles = files.filter(f => f.type.startsWith('image/'));
    if(imageFiles.length === 0) return;

    const room = MAX_IMAGES - selectedImages.length;
    if(room <= 0){
      formErr.textContent = 'You can attach up to ' + MAX_IMAGES + ' images per ticket.';
      formErr.classList.add('show');
      return;
    }
    formErr.classList.remove('show');
    const toProcess = imageFiles.slice(0, room);

    for(const file of toProcess){
      const placeholderIdx = selectedImages.length;
      selectedImages.push({ blob: null, url: '', kbLabel: '…' });
      renderPreviewGrid();
      try{
        const compressed = await compressImage(file, MAX_DIM, JPEG_QUALITY);
        selectedImages[placeholderIdx] = {
          blob: compressed,
          url: URL.createObjectURL(compressed),
          kbLabel: formatKB(compressed.size)
        };
      }catch(err){
        selectedImages[placeholderIdx] = {
          blob: file,
          url: URL.createObjectURL(file),
          kbLabel: formatKB(file.size)
        };
      }
      renderPreviewGrid();
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formErr.classList.remove('show');

    if(!configured){
      formErr.textContent = "This Bug Desk isn't connected to a database yet — see the setup notes in the file.";
      formErr.classList.add('show');
      return;
    }

    const desc = document.getElementById('desc').value.trim();
    const reporterName = document.getElementById('reporter-name').value.trim();
    const priority = form.querySelector('input[name="priority"]:checked').value;
    if(!desc){ return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Filing…";

    try{
      const imageUrls = [];
      for(const img of selectedImages){
        if(!img.blob) continue; // skip any still-compressing placeholder, shouldn't happen at submit time
        const ext = img.blob.type === 'image/jpeg' ? 'jpg' : 'png';
        const fname = Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
        const uploadRes = await fetch(STORAGE + fname, {
          method: 'POST',
          headers: { ...headers, 'Content-Type': img.blob.type || 'image/jpeg' },
          body: img.blob
        });
        if(!uploadRes.ok) throw new Error('Image upload failed');
        imageUrls.push(STORAGE_PUBLIC + fname);
      }

      const insertRes = await fetch(REST, {
        method: 'POST',
        headers: { ...headers, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
        body: JSON.stringify({
          description: desc,
          priority,
          image_url: imageUrls[0] || null,
          image_urls: imageUrls,
          reporter_id: REPORTER_ID,
          reporter_name: reporterName || null
        })
      });
      if(!insertRes.ok) throw new Error('Could not file ticket');
      const [created] = await insertRes.json();

      // let the poller pick this up naturally on its next tick,
      // but mark it known now so the reporter doesn't get a toast for their own ticket
      if(knownIds) knownIds.add(created.id);

      document.getElementById('submit-panel').style.display = 'none';
      document.getElementById('success-panel').style.display = 'block';
      document.getElementById('new-ticket-id').textContent = ticketId(created);
      document.getElementById('new-ticket-priority').textContent = 'Priority: ' + capitalize(priority);

    }catch(err){
      formErr.textContent = "Something went wrong — " + err.message + ". Try again?";
      formErr.classList.add('show');
    }finally{
      submitBtn.disabled = false;
      submitBtn.textContent = "File ticket";
    }
  });

  document.getElementById('file-another').addEventListener('click', () => {
    form.reset();
    selectedImages = [];
    renderPreviewGrid();
    document.getElementById('submit-panel').style.display = 'block';
    document.getElementById('success-panel').style.display = 'none';
  });

  // ---------- Queue ----------
  const ticketList = document.getElementById('ticket-list');
  const queueCount = document.getElementById('queue-count');
  const filters = document.getElementById('filters');
  let activeFilter = 'all';
  let allTickets = [];

  filters.addEventListener('click', e => {
    const btn = e.target.closest('.filter-chip');
    if(!btn) return;
    activeFilter = btn.dataset.p;
    [...filters.children].forEach(c => c.classList.toggle('active', c === btn));
    render();
  });

  const priorityRank = { urgent: 0, high: 1, medium: 2, low: 3 };

  async function loadTickets(){
    if(!configured){
      ticketList.innerHTML = '<div class="empty"><strong>Not connected yet</strong>Add your Supabase URL and anon key at the top of this file to start collecting tickets.</div>';
      queueCount.textContent = '';
      return;
    }
    if(allTickets.length === 0){
      ticketList.innerHTML = '<div class="empty">Loading…</div>';
    }
    try{
      const res = await fetch(REST + '?select=*&order=created_at.desc', { headers });
      if(!res.ok) throw new Error('fetch failed');
      allTickets = await res.json();
      render();
    }catch(err){
      ticketList.innerHTML = '<div class="empty"><strong>Couldn\'t load the queue</strong>Check your Supabase config and RLS policies.</div>';
    }
  }

  function updateCounts(){
    const counts = { urgent:0, high:0, medium:0, low:0 };
    allTickets.forEach(t => { if(counts[t.priority] !== undefined) counts[t.priority]++; });
    document.getElementById('count-all').textContent = allTickets.length || '';
    document.getElementById('count-urgent').textContent = counts.urgent || '';
    document.getElementById('count-high').textContent = counts.high || '';
    document.getElementById('count-medium').textContent = counts.medium || '';
    document.getElementById('count-low').textContent = counts.low || '';
  }

  // Tracks which tickets have their comment thread expanded, per view.
  const openThreads = new Set();

  function imagesFor(t){
    if(Array.isArray(t.image_urls) && t.image_urls.length) return t.image_urls;
    if(t.image_url) return [t.image_url];
    return [];
  }

  function galleryHtml(t){
    const imgs = imagesFor(t);
    if(!imgs.length) return '';
    return `<div class="ticket__gallery">${imgs.map(url => `<img class="ticket__thumb" src="${url}" data-full="${url}" alt="Screenshot">`).join('')}</div>`;
  }

  function render(){
    updateCounts();
    let list = allTickets.filter(t => activeFilter === 'all' || t.priority === activeFilter);
    list.sort((a,b) => (priorityRank[a.priority] ?? 9) - (priorityRank[b.priority] ?? 9) || new Date(b.created_at) - new Date(a.created_at));

    const openCount = allTickets.filter(t => t.status !== 'fixed').length;
    queueCount.textContent = openCount + ' open';

    if(list.length === 0){
      ticketList.innerHTML = '<div class="empty"><strong>Clear board</strong>No tickets match this filter.</div>';
      return;
    }

    ticketList.innerHTML = list.map(t => `
      <div class="ticket ${t.status === 'fixed' ? 'fixed' : ''}" data-p="${t.priority}" data-id="${t.id}">
        <div class="ticket__stub">${t.priority.toUpperCase()}</div>
        <div class="ticket__body">
          <div class="ticket__meta">
            <span class="ticket__id">${ticketId(t)}</span>
            <span class="ticket__time">${timeAgo(t.created_at)}</span>
            ${t.reporter_name ? `<span class="ticket__time">· ${escapeHtml(t.reporter_name)}</span>` : ''}
          </div>
          <p class="ticket__desc">${escapeHtml(t.description)}</p>
          ${galleryHtml(t)}
          <div class="ticket__footer">
            <select class="status-select" data-id="${t.id}">
              <option value="new" ${t.status==='new'?'selected':''}>New</option>
              <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option>
              <option value="fixed" ${t.status==='fixed'?'selected':''}>Fixed</option>
            </select>
            <div class="ticket__actions">
              <button type="button" class="comment-toggle ${hasUnseenComments(t.id) ? 'has-unread' : ''}" data-id="${t.id}">
                💬 ${commentCountFor(t.id) || ''} <span class="unread-dot"></span>
              </button>
              <button type="button" class="delete-btn" data-id="${t.id}" data-images='${JSON.stringify(imagesFor(t))}'>Delete</button>
            </div>
          </div>
          <div class="comment-thread ${openThreads.has('q-' + t.id) ? 'open' : ''}" data-thread-for="${t.id}">
            ${openThreads.has('q-' + t.id) ? commentThreadHtml(t.id) : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  // ---------- My tickets (reporter-facing, read-only) ----------
  const mineList = document.getElementById('mine-ticket-list');
  const mineCount = document.getElementById('mine-count');

  function renderMine(){
    const mine = allTickets
      .filter(t => t.reporter_id === REPORTER_ID)
      .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

    mineCount.textContent = mine.length ? mine.length + ' filed from this browser' : '';

    if(mine.length === 0){
      mineList.innerHTML = '<div class="empty"><strong>No tickets yet</strong>Tickets you file from this browser will show up here — including once they\'re marked fixed.</div>';
      return;
    }

    mineList.innerHTML = mine.map(t => `
      <div class="ticket ${t.status === 'fixed' ? 'fixed' : ''}" data-p="${t.priority}" data-id="${t.id}">
        <div class="ticket__stub">${t.priority.toUpperCase()}</div>
        <div class="ticket__body">
          <div class="ticket__meta">
            <span class="ticket__id">${ticketId(t)}</span>
            <span class="ticket__time">${timeAgo(t.created_at)}</span>
          </div>
          <p class="ticket__desc">${escapeHtml(t.description)}</p>
          ${galleryHtml(t)}
          <div class="ticket__footer">
            ${t.status === 'fixed'
              ? '<span class="fixed-pill">✓ Fixed</span>'
              : `<span class="status-pill">${t.status === 'in_progress' ? 'In progress' : 'New'}</span>`}
            <button type="button" class="comment-toggle ${hasUnseenComments(t.id) ? 'has-unread' : ''}" data-id="${t.id}">
              💬 ${commentCountFor(t.id) || ''} <span class="unread-dot"></span>
            </button>
          </div>
          <div class="comment-thread ${openThreads.has('m-' + t.id) ? 'open' : ''}" data-thread-for="${t.id}">
            ${openThreads.has('m-' + t.id) ? commentThreadHtml(t.id) : ''}
          </div>
        </div>
      </div>
    `).join('');
  }

  mineList.addEventListener('click', e => {
    const toggle = e.target.closest('.comment-toggle');
    if(!toggle) return;
    const id = toggle.dataset.id;
    const key = 'm-' + id;
    if(openThreads.has(key)) openThreads.delete(key);
    else{
      openThreads.add(key);
      markSeen(id, commentCountFor(id));
    }
    renderMine();
  });

  mineList.addEventListener('submit', async e => {
    const form = e.target.closest('.comment-form');
    if(!form) return;
    e.preventDefault();
    const bugId = form.dataset.bugId;
    const input = form.querySelector('input');
    const msg = input.value.trim();
    if(!msg) return;
    const btn = form.querySelector('button');
    btn.disabled = true;
    const nameGuess = (allTickets.find(t => t.id === bugId) || {}).reporter_name || 'You';
    try{
      await postComment(bugId, msg, 'reporter', nameGuess);
      markSeen(bugId, commentCountFor(bugId));
      renderMine();
    }catch(err){
      btn.disabled = false;
    }
  });

  mineList.addEventListener('click', e => {
    const img = e.target.closest('.ticket__thumb');
    if(!img) return;
    document.getElementById('lightbox-img').src = img.dataset.full;
    document.getElementById('lightbox').classList.add('show');
  });

  ticketList.addEventListener('change', async e => {
    if(!e.target.classList.contains('status-select')) return;
    const id = e.target.dataset.id;
    const status = e.target.value;
    try{
      await fetch(REST + '?id=eq.' + id, {
        method: 'PATCH',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      const t = allTickets.find(x => x.id === id);
      if(t) t.status = status;
      render();
    }catch(err){}
  });

  ticketList.addEventListener('click', async e => {
    const img = e.target.closest('.ticket__thumb');
    if(img){
      document.getElementById('lightbox-img').src = img.dataset.full;
      document.getElementById('lightbox').classList.add('show');
      return;
    }

    const delBtn = e.target.closest('.delete-btn');
    if(!delBtn) return;

    if(!delBtn.classList.contains('confirming')){
      delBtn.classList.add('confirming');
      delBtn.textContent = 'Confirm delete?';
      delBtn.dataset.confirmTimer = setTimeout(() => {
        delBtn.classList.remove('confirming');
        delBtn.textContent = 'Delete';
      }, 3000);
      return;
    }

    clearTimeout(delBtn.dataset.confirmTimer);
    const id = delBtn.dataset.id;
    let imageUrls = [];
    try{ imageUrls = JSON.parse(delBtn.dataset.images || '[]'); }catch(e){}
    const ticketEl = delBtn.closest('.ticket');
    delBtn.disabled = true;
    delBtn.textContent = 'Deleting…';

    try{
      const delRes = await fetch(REST + '?id=eq.' + id, {
        method: 'DELETE',
        headers: { ...headers, 'Prefer': 'return=representation' }
      });
      if(!delRes.ok) throw new Error('Delete request failed (' + delRes.status + ')');
      const deletedRows = await delRes.json().catch(() => []);
      if(!Array.isArray(deletedRows) || deletedRows.length === 0){
        // Nothing was actually deleted server-side — almost always a missing RLS delete policy.
        throw new Error('Nothing was deleted — check the delete policy on the bugs table in Supabase');
      }

      for(const imageUrl of imageUrls){
        const fname = imageUrl.split('/screenshots/')[1];
        if(fname){
          await fetch(STORAGE + fname, { method: 'DELETE', headers }).catch(() => {});
        }
      }

      allTickets = allTickets.filter(t => t.id !== id);
      if(knownIds) knownIds.delete(id);
      if(ticketEl){
        ticketEl.classList.add('removing');
        setTimeout(() => render(), 200);
      } else {
        render();
      }
    }catch(err){
      delBtn.disabled = false;
      delBtn.classList.remove('confirming');
      delBtn.textContent = 'Delete failed';
      setTimeout(() => { delBtn.textContent = 'Delete'; }, 2500);
      console.error('Bug Desk delete error:', err.message);
    }
  });

  // Comment thread toggle + submit for the admin queue view
  ticketList.addEventListener('click', e => {
    const toggle = e.target.closest('.comment-toggle');
    if(!toggle) return;
    const id = toggle.dataset.id;
    const key = 'q-' + id;
    if(openThreads.has(key)) openThreads.delete(key);
    else{
      openThreads.add(key);
      markSeen(id, commentCountFor(id));
    }
    render();
  });

  ticketList.addEventListener('submit', async e => {
    const form = e.target.closest('.comment-form');
    if(!form) return;
    e.preventDefault();
    const bugId = form.dataset.bugId;
    const input = form.querySelector('input');
    const msg = input.value.trim();
    if(!msg) return;
    const btn = form.querySelector('button');
    btn.disabled = true;
    try{
      await postComment(bugId, msg, 'admin', 'Bug Desk team');
      markSeen(bugId, commentCountFor(bugId));
      render();
    }catch(err){
      btn.disabled = false;
    }
  });

  document.getElementById('lightbox').addEventListener('click', function(){ this.classList.remove('show'); });

  function ticketId(t){
    return 'BD-' + (t.id || '').toString().replace(/-/g,'').slice(0,4).toUpperCase();
  }
  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
  function timeAgo(iso){
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if(diff < 60) return 'just now';
    if(diff < 3600) return Math.floor(diff/60) + 'm ago';
    if(diff < 86400) return Math.floor(diff/3600) + 'h ago';
    return Math.floor(diff/86400) + 'd ago';
  }

  if(!configured){
    document.getElementById('subline').textContent = 'not connected — see setup notes';
    document.getElementById('live-dot').style.background = 'var(--text-faint)';
  }

  // Safe to run now — every variable showView touches has been initialized above.
  if(window.location.hash === '#queue'){ showView('queue'); }
  if(window.location.hash === '#mine'){ showView('mine'); }
})();
</script>
</body>
</html>
